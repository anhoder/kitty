# Detection rules for oh-my-pi (omp). Written for kitty from live pane
# captures; herdr has no screen manifest for omp because its plugin reports
# state over herdr's own socket, which kitty cannot consume.
#
# Evidence: omp 2026.10 live panes.
#
# omp sets an OSC title of the form "π <marker> <emoji> <TAG>: <task>". The
# marker after the pi glyph is the whole signal: ">" at rest, a braille
# spinner during a turn.
#
#   idle     "π > 🌐 I18N: Split i18n sync audit prompt"
#   working  "π ⠙ 👂 HERDR: Align kitty state monitoring with herdr"
#
# Its prompt box header carries the same distinction, and adds elapsed time
# while a turn runs. This is the fallback when titles are turned off:
#
#   idle     "╭── π > ⟳ Opus 5 > 📁 ~/Desktop/www/aireach > ..."
#   working  "╭── ⠧ 2m > ◒ Opus 5 > 📁 ~/Desktop/kitty > ..."
#
# The model glyph (◒, ⟳) sits in both states and must never be read as
# activity.
id = "omp"
version = "2026.10.29.1"
updated_at = "2026-10-29T00:00:00Z"
aliases = ["oh-my-pi"]
# omp does not emit OSC 7501 in kitty, so there is no report to defer to and
# the screen is the only source. Should it gain lifecycle reporting later,
# flip this to full_lifecycle.
state_authority = "identity_only"

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1100
region = "osc_title"
visible_working = true
# The marker sits after the pi glyph: "> " at rest, a braille spinner during a
# turn. The pane title keeps the pi glyph in both states, so the marker is the
# only thing that distinguishes them.
regex = ['^\x{03C0}\s+[\x{2800}-\x{28FF}](?:\s|$)']

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 250
region = "osc_title"
visible_idle = true
regex = ['^\x{03C0}\s*>']
not = [{ regex = ['^\x{03C0}\s+[\x{2800}-\x{28FF}]'] }]

[[rules]]
id = "prompt_header_working"
state = "working"
priority = 900
region = "bottom_non_empty_lines(4)"
visible_working = true
# Box header opens with a spinner and the elapsed turn time. Anchoring on the
# header start keeps transcript text from impersonating it, and requiring the
# timer keeps a redrawn-but-finished header from counting.
line_regex = ['^\s*\u256d\u2500*\s*[\x{2800}-\x{28FF}]\s+\d+[smh]\b']

[[rules]]
id = "prompt_header_idle"
state = "idle"
priority = 200
region = "bottom_non_empty_lines(4)"
visible_idle = true
line_regex = ['^\s*\u256d\u2500*\s*\x{03C0}\s*>']
not = [{ line_regex = ['^\s*\u256d\u2500*\s*[\x{2800}-\x{28FF}]'] }]
