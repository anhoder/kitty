# Derived from herdr's agent-detection manifest for pi.
# Source: https://herdr.dev/agent-detection/ (Apache-2.0)
id = "pi"
version = "2026.10.01.1"
updated_at = "2026-10-01T00:00:00Z"

# Its integration reports every lifecycle transition, so its own reports
# outrank these screen rules.
state_authority = "full_lifecycle"

[resume]
argv = ["pi", "--session", "{session}"]

[[rules]]
id = "working_literal"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
any = [
  { contains = ["Working..."] },
  { line_regex = ['^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] Working$'] },
]

[[rules]]
id = "working_border"
state = "working"
priority = 100
region = "bottom_non_empty_lines(12)"
visible_working = true
any = [
  { line_regex = ['^── [⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] Working ─+$'] },
  { line_regex = ['^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] Working$'] },
]
