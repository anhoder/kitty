# Derived from herdr's agent-detection manifest for Kilo Code CLI.
# Source: https://herdr.dev/agent-detection/ (Apache-2.0)
id = "kilo"
version = "2026.06.10.1"
updated_at = "2026-06-10T00:00:00Z"
aliases = ["kilo-code", "kilo code"]

# Its integration reports every lifecycle transition, so its own reports
# outrank these screen rules.
state_authority = "full_lifecycle"

[resume]
argv = ["kilo", "--session", "{session}"]

[[rules]]
id = "opencode_permission"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["△ Permission required"] },
  { contains = ["esc dismiss"], any = [{ contains = ["enter confirm"] }, { contains = ["enter submit"] }, { contains = ["enter toggle"] }], all = [{ any = [{ contains = ["↑↓ select"] }, { contains = ["⇆ tab"] }] }] },
]

[[rules]]
id = "esc_interrupt_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
contains = ["esc interrupt"]
